<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Dashboard</title>
    <style>
        :root {
            --gold-bright: #ffd700;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-light: #ffffff;
            --accent-blue: #007bff;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000;
            padding: 10px 20px;
            border-bottom: 2px solid var(--gold-bright);
        }

        .user-info span {
            margin-right: 15px;
            font-weight: bold;
        }

        .btn-logout {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
        }

        .main-layout {
            display: flex;
            min-height: calc(100vh - 60px);
        }

        .sidebar {
            width: 200px;
            background-color: var(--panel-bg);
            padding: 15px;
            border-right: 1px solid #333;
        }

        .sidebar-menu .menu-item {
            padding: 10px;
            margin-bottom: 5px;
            background-color: #2a2a2a;
            cursor: pointer;
            border-radius: 4px;
        }

        .sidebar-menu .menu-item.active {
            background-color: var(--accent-blue);
        }

        .content-area {
            flex-grow: 1;
            padding: 20px;
        }

        .controls-box {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-bet-opt, .view-by-btn, .coin-btn {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-bet-opt.active, .view-by-btn.active, .coin-btn.selected-coin {
            background-color: var(--gold-bright);
            color: #000;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 15px;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .matrix-table td {
            border: 1px solid #444;
            padding: 10px;
            background-color: #252525;
            cursor: pointer;
            user-select: none;
        }

        .matrix-table td.selected-cell {
            background-color: #28a745 !important;
            color: #fff;
        }

        .patti-num {
            font-size: 16px;
            font-weight: bold;
            display: block;
        }

        .patti-word {
            font-size: 12px;
            color: #aaa;
            display: block;
        }

        .summary-panel {
            margin-top: 20px;
            padding: 15px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 4px;
        }

        .action-btns {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn-action {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        #btnSubmitBet { background-color: #28a745; color: white; }
        #btnResetBoard { background-color: #ffc107; color: black; }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <div class="user-info">
            <span id="lblPlayerId">Profile: --</span>
            <span>Play Points: <strong id="txtPlayPoints" style="color:var(--gold-bright)">৳0</strong></span>
            <span>Win Points: <strong id="txtWinPoints" style="color:#28a745">৳0</strong></span>
        </div>
        <button class="btn-logout">Logout</button>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-menu">
                <div class="menu-item active">Play Board</div>
                <div class="menu-item">Transaction Report</div>
                <div class="menu-item">Account Balance</div>
                <div class="menu-item">Play History</div>
                <div class="menu-item">Results</div>
                <div class="menu-item">Settings</div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Controls -->
            <div class="controls-box" id="numberRangeBox">
                <strong>Range: </strong>
                <button class="btn-bet-opt active" data-range="A">A (1-25)</button>
                <button class="btn-bet-opt" data-range="B">B (26-50)</button>
                <button class="btn-bet-opt" data-range="C">C (51-75)</button>
                <button class="btn-bet-opt" data-range="D">D (76-100)</button>
            </div>

            <div class="controls-box" id="viewModeBox">
                <strong>View By: </strong>
                <button class="view-by-btn active" data-mode="Both">Both</button>
                <button class="view-by-btn" data-mode="Digit">Digit</button>
                <button class="view-by-btn" data-mode="Word">Word</button>
            </div>

            <div class="controls-box" id="coinValueBox">
                <strong>Coin Value: </strong>
                <button class="coin-btn selected-coin" data-coin="10">10</button>
                <button class="coin-btn" data-coin="50">50</button>
                <button class="coin-btn" data-coin="100">100</button>
                <button class="coin-btn" data-coin="500">500</button>
            </div>

            <!-- Matrix Table -->
            <div class="table-container">
                <table class="matrix-table">
                    <tbody id="matrixBody">
                        <!-- Dynamic cells rendered by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Summary & Actions -->
            <div class="summary-panel" id="selectedItemsContainer">
                Your selections will appear here
            </div>

            <div class="action-btns">
                <button class="btn-action" id="btnSubmitBet">Submit Bet</button>
                <button class="btn-action" id="btnResetBoard">Reset Board</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Execution -->
    <script>
        const WORD_LIST = ["AXZ", "BKP", "LMO", "RST", "TUV", "WXY", "NOP", "ABC", "EFG", "HIJ", "KLM", "QRS", "UVW", "XYZ", "DEF", "GHI", "JKL", "MNO", "PQR", "STU", "VWX", "ZAB", "BCA", "CAB", "DAB"];

        const RANGE_CONFIG = {
            'A': { start: 1, end: 25 },
            'B': { start: 26, end: 50 },
            'C': { start: 51, end: 75 },
            'D': { start: 76, end: 100 }
        };

        let selectedPattis = new Set();
        let selectedCoinValue = 10;
        let activeViewMode = 'Both';
        let activeRange = 'A';
        let currentUser = null;

        function loadPlayerProfile() {
            const loggedInUser = sessionStorage.getItem('loggedInUser') || "DemoUser";
            sessionStorage.setItem('loggedInUser', loggedInUser);

            const lblPlayerId = document.getElementById('lblPlayerId');
            if (lblPlayerId) lblPlayerId.innerText = `Profile: ${loggedInUser}`;

            let users = JSON.parse(localStorage.getItem('game_users') || '{}');
            if (!users[loggedInUser]) {
                users[loggedInUser] = { balance: 5000, winBalance: 0 };
                localStorage.setItem('game_users', JSON.stringify(users));
            }
            
            currentUser = loggedInUser;
            updateBalanceUI(users[loggedInUser].balance, users[loggedInUser].winBalance || 0);
        }

        function updateBalanceUI(balance, winBalance = 0) {
            const txtPlay = document.getElementById('txtPlayPoints');
            const txtWin = document.getElementById('txtWinPoints');
            if (txtPlay) txtPlay.innerText = `৳${Number(balance).toLocaleString()}`;
            if (txtWin) txtWin.innerText = `৳${Number(winBalance).toLocaleString()}`;
        }

        function initTable() {
            const tbody = document.getElementById('matrixBody');
            if (!tbody) return;

            tbody.innerHTML = "";
            selectedPattis.clear();
            updateSelectionSummary();

            const config = RANGE_CONFIG[activeRange] || RANGE_CONFIG['A'];
            let currentNum = config.start;
            let itemsPerRow = 5;
            let totalItems = (config.end - config.start) + 1;
            let rowsCount = Math.ceil(totalItems / itemsPerRow);

            for (let r = 0; r < rowsCount; r++) {
                let tr = document.createElement('tr');
                for (let c = 0; c < itemsPerRow; c++) {
                    if (currentNum > config.end) {
                        let emptyTd = document.createElement('td');
                        tr.appendChild(emptyTd);
                        continue;
                    }

                    let td = document.createElement('td');
                    let wordItem = WORD_LIST[(currentNum - 1) % WORD_LIST.length];
                    let displayNum = currentNum;
                    let uniqueId = `${displayNum}-${wordItem}`;

                    td.innerHTML = `
                        <div class="patti-item" data-id="${uniqueId}">
                            <span class="patti-num">${displayNum}</span>
                            <span class="patti-word">${wordItem}</span>
                        </div>
                    `;

                    td.addEventListener('click', function() {
                        if (selectedPattis.has(uniqueId)) {
                            selectedPattis.delete(uniqueId);
                            this.classList.remove('selected-cell');
                        } else {
                            selectedPattis.add(uniqueId);
                            this.classList.add('selected-cell');
                        }
                        updateSelectionSummary();
                    });

                    tr.appendChild(td);
                    currentNum++;
                }
                tbody.appendChild(tr);
            }
            applyViewMode(activeViewMode);
        }

        function applyViewMode(mode) {
            activeViewMode = mode;
            const nums = document.querySelectorAll('.patti-num');
            const words = document.querySelectorAll('.patti-word');

            nums.forEach(el => el.style.display = (mode === 'Word') ? 'none' : 'block');
            words.forEach(el => el.style.display = (mode === 'Digit') ? 'none' : 'block');
        }

        function updateSelectionSummary() {
            const container = document.getElementById('selectedItemsContainer');
            if (!container) return;

            if (selectedPattis.size === 0) {
                container.innerText = "Your selections will appear here";
                return;
            }
            const totalBet = selectedPattis.size * selectedCoinValue;
            container.innerHTML = `<div>Selected: <strong>${selectedPattis.size}</strong> items | Range: <strong>${activeRange}</strong> | Total Stake: <strong style="color:var(--gold-bright)">৳${totalBet}</strong></div>`;
        }

        function setupNavigation() {
            document.querySelectorAll('.sidebar-menu .menu-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.sidebar-menu .menu-item').forEach(m => m.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            const logoutBtn = document.querySelector('.btn-logout');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    sessionStorage.removeItem('loggedInUser');
                    window.location.href = 'index.html';
                });
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadPlayerProfile();
            initTable();
            setupNavigation();

            document.querySelectorAll('#viewModeBox .view-by-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#viewModeBox .view-by-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    applyViewMode(this.getAttribute('data-mode'));
                });
            });

            document.querySelectorAll('#numberRangeBox .btn-bet-opt').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#numberRangeBox .btn-bet-opt').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    activeRange = this.getAttribute('data-range');
                    initTable();
                });
            });

            document.querySelectorAll('#coinValueBox .coin-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#coinValueBox .coin-btn').forEach(b => b.classList.remove('selected-coin'));
                    this.classList.add('selected-coin');
                    selectedCoinValue = parseInt(this.getAttribute('data-coin'));
                    updateSelectionSummary();
                });
            });

            const btnReset = document.getElementById('btnResetBoard');
            if (btnReset) {
                btnReset.addEventListener('click', () => {
                    selectedPattis.clear();
                    document.querySelectorAll('.matrix-table td').forEach(cell => cell.classList.remove('selected-cell'));
                    updateSelectionSummary();
                });
            }

            const btnSubmit = document.getElementById('btnSubmitBet');
            if (btnSubmit) {
                btnSubmit.addEventListener('click', () => {
                    if (selectedPattis.size === 0) {
                        alert("❌ অনুগ্রহ করে অন্তত একটি আইটেম সিলেক্ট করুন!");
                        return;
                    }

                    const totalAmount = selectedPattis.size * selectedCoinValue;
                    let users = JSON.parse(localStorage.getItem('game_users') || '{}');
                    let user = users[currentUser];

                    if (!user || user.balance < totalAmount) {
                        alert(`❌ আপনার পর্যাপ্ত ব্যালেন্স নেই!\nপ্রয়োজন: ৳${totalAmount}`);
                        return;
                    }

                    user.balance -= totalAmount;
                    users[currentUser] = user;
                    localStorage.setItem('game_users', JSON.stringify(users));

                    updateBalanceUI(user.balance, user.winBalance || 0);
                    alert(`✅ বেট সফল হয়েছে! ৳${totalAmount} কেটে নেওয়া হয়েছে।`);

                    selectedPattis.clear();
                    document.querySelectorAll('.matrix-table td').forEach(cell => cell.classList.remove('selected-cell'));
                    updateSelectionSummary();
                });
            }
        });
    </script>
</body>
</html>
