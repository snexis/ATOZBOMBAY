<script>
        const mockData = [
            {num: "100", word: "AXZ"}, {num: "200", word: "BCA"}, {num: "300", word: "CAG"},
            {num: "400", word: "EAK"}, {num: "500", word: "GAL"}, {num: "600", word: "JAN"},
            {num: "700", word: "LAP"}, {num: "800", word: "NAR"}, {num: "900", word: "RAS"}
        ];

        let selectedPattis = new Set();
        let selectedCoinValue = 10;
        let activeViewMode = 'Both';

        function initTable() {
            const tbody = document.getElementById('matrixBody');
            tbody.innerHTML = "";
            for (let r = 0; r < 15; r++) {
                let tr = document.createElement('tr');
                for (let c = 0; c < 9; c++) {
                    let td = document.createElement('td');
                    let dataIndex = (r + c) % mockData.length;
                    let item = mockData[dataIndex];
                    let displayNum = parseInt(item.num) + (r * 10);
                    let uniqueId = `${displayNum}-${item.word}`;

                    td.innerHTML = `
                        <div class="patti-item" data-id="${uniqueId}">
                            <span class="patti-num">${displayNum}</span>
                            <span class="patti-word">${item.word}</span>
                        </div>
                    `;

                    td.addEventListener('click', function() {
                        if (selectedPattis.has(uniqueId)) {
                            selectedPattis.delete(uniqueId);
                            this.classList.remove('selected-cell');
                        } else {
                            selectedPattis.add(uniqueId);
                            this.classList.add('selected-cell');
                        }
                        updateSelectionSummary();
                    });

                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            applyViewMode(activeViewMode);
        }

        function applyViewMode(mode) {
            activeViewMode = mode;
            const nums = document.querySelectorAll('.patti-num');
            const words = document.querySelectorAll('.patti-word');

            nums.forEach(el => {
                el.style.display = (mode === 'Word') ? 'none' : 'block';
            });
            words.forEach(el => {
                el.style.display = (mode === 'Digit') ? 'none' : 'block';
            });
        }

        function updateSelectionSummary() {
            const container = document.getElementById('selectedItemsContainer');
            if (selectedPattis.size === 0) {
                container.innerText = "Your selections will appear here";
                return;
            }
            const totalBet = selectedPattis.size * selectedCoinValue;
            container.innerHTML = `<div>Selected: <strong>${selectedPattis.size}</strong> items<br>Total Stake: <strong style="color:var(--gold-bright)">৳${totalBet}</strong></div>`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            initTable();

            document.querySelectorAll('.view-by-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.view-by-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const mode = this.getAttribute('data-mode');
                    applyViewMode(mode);
                });
            });

            document.querySelectorAll('#numberRangeBox .btn-bet-opt').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#numberRangeBox .btn-bet-opt').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            document.querySelectorAll('#betTypeBox .btn-bet-opt').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#betTypeBox .btn-bet-opt').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            document.querySelectorAll('.coin-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.coin-btn').forEach(b => b.classList.remove('selected-coin'));
                    this.classList.add('selected-coin');
                    selectedCoinValue = parseInt(this.getAttribute('data-coin'));
                    updateSelectionSummary();
                });
            });

            document.getElementById('btnResetBoard').addEventListener('click', () => {
                selectedPattis.clear();
                document.querySelectorAll('.matrix-table td').forEach(cell => cell.classList.remove('selected-cell'));
                updateSelectionSummary();
            });

            document.getElementById('btnSubmitBet').addEventListener('click', () => {
                if (selectedPattis.size === 0) {
                    alert("Please select at least one item!");
                    return;
                }
                const totalAmount = selectedPattis.size * selectedCoinValue;
                alert(`Bet placed successfully!\nTotal Items: ${selectedPattis.size}\nTotal Amount: ৳${totalAmount}`);
            });
        });
    </script>
